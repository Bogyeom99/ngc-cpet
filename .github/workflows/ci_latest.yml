name: CI latest

on:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m py_compile streamlit_app.py services/*.py
      - run: python -c "from streamlit_quill import st_quill; print('streamlit_quill import ok')"
      - run: pytest -q || true
